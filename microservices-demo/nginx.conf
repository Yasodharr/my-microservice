server {
    listen 80;

    location /users/ {
        proxy_pass http://user-service:8000;
    }

    location /products/ {
        proxy_pass http://product-service:8001;
    }

    location /orders/ {
        proxy_pass http://order-service:8002;
    }

    location /user-health {
        proxy_pass http://user-service:8000/health;
    }

    location /product-health {
        proxy_pass http://product-service:8001/health;
    }

    location /order-health {
        proxy_pass http://order-service:8002/health;
    }
}
